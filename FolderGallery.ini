[General]
; Folder to show. Leave empty to use Documents\My Games\Skyrim Special Edition\FolderGallery\Pictures
; (created automatically). That folder is outside Data, so pictures you add while the game is running
; show up after pressing Refresh. Folders inside Data are virtual under Mod Organizer 2, and pictures
; added to them only appear after restarting the game.
; Absolute paths work too, e.g. sFolder=C:\Users\you\Pictures\Skyrim
sFolder=
; Open/close key, as a Windows virtual-key code. 119 = F8, 120 = F9 (quickload!), 45 = Insert, 36 = Home
iToggleKey=119
; 1 = also look inside sub-folders
bRecursive=0
; Starting thumbnail size in pixels (100-320)
iThumbnailSize=200
; Text size at 1080p - the window scales up automatically on bigger screens (1440p, 4K)
fFontSize=18
; Extra size for the whole window on top of that (e.g. 1.2 = 20% bigger)
fUIScale=1.0
; Mouse speed in the gallery window (0.1 - 10)
fMouseSpeed=1.0

[Frames]
; Hanging pictures on walls: open a picture in the gallery and click "Hang on wall...".
; While aiming: left-click hang, wheel size, Shift+wheel frame style, Up/Down arrow distance from wall
; (Shift+Up/Down = big steps; Down pushes the frame through the wall's invisible collision),
; right-click or Esc cancel. Activate (E) a hung picture to change, move, resize, nudge or take it down.
; Pictures are converted to DDS in Data\Textures\FolderGallery\Placed\ (long side in pixels: 512, 1024 or 2048)
iPictureResolution=1024
; Frame preselected in the hang dialog: 0 Canvas, 1 Light Pine, 2 Dark Oak, 3 Gilded, 4 Black Iron,
; 5 Dwemer, 6 Whiterun, 7 Windhelm, 8 Thirsk, 9 Dragonsreach
iDefaultFrameStyle=2
; How far away (game units) the preview follows your aim and you can hang a picture
fPlaceReach=2000
; How far away you can examine (Activate) a hung picture - works even when it's pushed into the wall
fExamineReach=600

[Debug]
; Troubleshooting switches. Set one to 0 to find out which part causes a problem.
; 1 = hook the game's rendering (needed to draw the window)
bHookPresent=1
; 1 = listen to keyboard/mouse input (needed for the toggle key)
bInputSink=1
