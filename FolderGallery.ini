[General]
; Folder to show. Leave empty to use Documents\My Games\Skyrim Special Edition\FolderGallery\Pictures
; (created automatically). That folder is outside Data, so pictures you add while the game is running
; show up after pressing Refresh. Folders inside Data are virtual under Mod Organizer 2, and pictures
; added to them only appear after restarting the game.
; Absolute paths work too, e.g. sFolder=C:\Users\you\Pictures\Skyrim
sFolder=
; Open/close key, as a Windows virtual-key code. 119 = F8, 120 = F9 (quickload!), 45 = Insert, 36 = Home
iToggleKey=119
; 1 = also look inside sub-folders
bRecursive=0
; Thumbnail size in pixels (100-320) - saved when you move the Thumbnails slider
iThumbnailSize=200
; Folder tab the gallery opens on: 0 All, 1 Landscape, 2 Square, 3 Portrait - saved when you click a tab
iGalleryFolder=0
; Text size at 1080p - the window scales up automatically on bigger screens (1440p, 4K)
fFontSize=18
; Size of all Folder Gallery windows on top of that (0.6 - 2.0). Also changeable in game:
; "Interface" slider in the gallery, or Ctrl + mouse wheel over any Folder Gallery window
fUIScale=1.0
; Mouse speed in the gallery window (0.1 - 10)
fMouseSpeed=1.0

[Frames]
; Hanging pictures on walls: open a picture in the gallery and click "Hang on wall...".
; While aiming: left-click hang, wheel size, Shift+wheel frame style, Up/Down arrow distance from wall
; (Shift+Up/Down = big steps; Down pushes the frame through the wall's invisible collision),
; right-click or Esc cancel. Activate (E) a hung picture to change, move, resize, nudge or take it down.
; Pictures are converted to DDS in Data\Textures\FolderGallery\Placed\ (long side in pixels: 512, 1024 or 2048)
iPictureResolution=1024
; Frame preselected in the hang dialog: its position in the frame list of the chosen shape, from 0
; (Landscape has 29 frames, Square 20, Portrait 10). 7 = Rustic Dark Oak (Landscape/Square), Smoked Oak (Portrait)
iDefaultFrameStyle=7
; How far away (game units) the preview follows your aim and you can hang a picture
fPlaceReach=2000
; How far away you can examine (Activate) a hung picture - works even when it's pushed into the wall
fExamineReach=600
; 1 = delete converted pictures (Textures\FolderGallery\Placed) that no picture in the current save uses.
; Older saves are fine: missing textures are rebuilt from the original picture when they load.
bCleanUpTextures=1

[Debug]
; Troubleshooting switches. Set one to 0 to find out which part causes a problem.
; 1 = hook the game's rendering (needed to draw the window)
bHookPresent=1
; 1 = listen to keyboard/mouse input (needed for the toggle key)
bInputSink=1

[Notifications]
; Messages in the top-left corner of the screen. 1 = show, 0 = hide. Everything is also written to FolderGallery.log.
; Master switch: 0 hides all of them
bNotifications=1
; "Size: 110%" when you scroll the wheel while hanging a picture
bShowSize=0
; "Distance from wall: +0.50" when you press Up/Down while hanging a picture
bShowDistance=0
; "Frame: Rustic Dark Oak" when you Shift+scroll while hanging a picture
bShowFrameName=0
; How-to line when you start hanging a picture
bShowPlacementHelp=1
; "Picture hung", "Picture taken down", "Hanging cancelled"
bShowConfirmations=1
; "Can't hang it here" kinds of messages (aimed at the floor, too far away...)
bShowPlacementWarnings=1
; Something went wrong (frame record missing, picture could not be converted...) - best left on
bShowErrors=1
; Small line at the bottom of the screen while hanging a picture: frame, shape, size and distance, plus the keys.
; Drawn by Folder Gallery itself, so it never stacks up like the notifications.
bShowPlacementInfo=1
