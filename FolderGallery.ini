[General]
; Folder to show. Relative paths start at the game folder (where SkyrimSE.exe is).
; Absolute paths work too, e.g. sFolder=C:\Users\you\Pictures\Skyrim
sFolder=Data\SKSE\Plugins\FolderGallery\Pictures
; Open/close key, as a Windows virtual-key code. 119 = F8, 120 = F9 (quickload!), 45 = Insert, 36 = Home
iToggleKey=119
; 1 = also look inside sub-folders
bRecursive=0
; Starting thumbnail size in pixels (100-320)
iThumbnailSize=200
; Text size in the window (raise it on 4K screens)
fFontSize=18
; Mouse speed in the gallery window (0.1 - 10)
fMouseSpeed=1.0

[Frames]
; Hanging pictures on walls: open a picture in the gallery and click "Hang on wall...".
; Pictures are converted to DDS in Data\Textures\FolderGallery\Placed\ (long side in pixels: 512, 1024 or 2048)
iPictureResolution=1024
; Frame preselected in the hang dialog: 0 Canvas, 1 Light Pine, 2 Dark Oak, 3 Gilded, 4 Black Iron,
; 5 Dwemer, 6 Whiterun, 7 Windhelm, 8 Thirsk, 9 Dragonsreach
iDefaultFrameStyle=2
; How far away (game units) you can hang a picture
fMaxPlaceDistance=400

[Debug]
; Troubleshooting switches. Set one to 0 to find out which part causes a problem.
; 1 = hook the game's rendering (needed to draw the window)
bHookPresent=1
; 1 = listen to keyboard/mouse input (needed for the toggle key)
bInputSink=1
